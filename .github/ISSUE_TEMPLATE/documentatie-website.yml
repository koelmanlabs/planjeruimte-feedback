name: Documentatie / website
description: Meld onduidelijke, ontbrekende of onjuiste uitleg.
title: "[Documentatie] "
body:
  - type: dropdown
    id: type
    attributes:
      label: Waar gaat de melding over?
      options:
        - PlanjeRuimte-documentatie
        - Website planjeruimte.nl
        - Installatie/uitleg
        - Andere documentatie
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Pagina of locatie
      description: Voeg indien mogelijk de URL, bestandsnaam of sectie toe.
      placeholder: https://www.planjeruimte.nl/...
    validations:
      required: false

  - type: textarea
    id: issue
    attributes:
      label: Wat is onduidelijk, onjuist of ontbreekt?
      placeholder: Beschrijf wat je hebt gevonden.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestie voor verbetering
      description: Als je een concrete tekst of aanvulling voorstelt, kun je die hier plaatsen.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Ik heb gecontroleerd dat deze melding geen wachtwoorden, persoonsgegevens of vertrouwelijke gegevens bevat.
          required: true
